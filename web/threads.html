<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Парсер Threads</title>
<style>
  :root { --bg:#f6f6f4; --card:#ffffff; --soft:#efefeb; --line:#e4e3de; --text:#1b1c1f; --dim:#73767e; --accent:#4b5bdc; --accent-ink:#ffffff;
    --ok:#1f8a5b; --ok-soft:#e3f4ec; --bad:#c7403d; --bad-soft:#fbe9e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#191b1f; --soft:#22252a; --line:#2b2e35; --text:#eceded; --dim:#9195a0; --accent:#8b98ff; --accent-ink:#0f1230;
    --ok:#56c794; --ok-soft:#173528; --bad:#f07f7b; --bad-soft:#3a1c1b; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; align-items:center; gap:6px; margin-bottom:22px; }
  header b { font-size:17px; flex:1; }
  button { font:inherit; font-weight:550; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 16px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  button.big { font-size:18px; padding:14px 30px; border-radius:14px; }
  button.link { border:0; background:none; color:var(--dim); padding:8px 10px; }
  button.link:hover { color:var(--text); }
  input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; width:100%; }
  textarea { resize:vertical; min-height:110px; }
  label { display:block; font-size:14px; color:var(--dim); margin:14px 0 5px; }
  label.check { display:flex; gap:10px; align-items:center; color:var(--text); font-size:15px; }
  label.check input { width:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; }
  .dim { color:var(--dim); }
  .small { font-size:14px; }

  .start { display:flex; gap:10px; }
  .start input { font-size:17px; padding:14px 16px; border-radius:14px; }
  .running { display:flex; align-items:center; gap:14px; }
  .running div { flex:1; min-width:0; }
  .running b { display:block; font-size:18px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 5px var(--ok-soft); flex:none; }
  .error { margin-top:14px; padding:11px 14px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .chip { background:var(--soft); border-radius:999px; padding:4px 6px 4px 12px; font-size:14px; display:inline-flex; align-items:center; gap:2px; }
  .chip.on { background:var(--text); color:var(--bg); } .chip.on button { color:var(--bg); }
  .chip span { cursor:pointer; }
  .rank { width:26px; text-align:right; color:var(--dim); font-size:14px; flex:none; }
  .chip button { border:0; background:none; padding:0 6px; color:var(--dim); font-size:16px; line-height:1; }

  .tabs { display:flex; gap:22px; margin:30px 4px 12px; border-bottom:1px solid var(--line); }
  .tabs button { border:0; background:none; padding:0 0 10px; border-radius:0; color:var(--dim); font-size:17px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.on { color:var(--text); border-color:var(--text); }
  .row { display:flex; gap:13px; align-items:center; padding:13px 4px; border-bottom:1px solid var(--line); }
  .row .mid { flex:1; min-width:0; overflow-wrap:anywhere; }
  .row a { color:inherit; text-decoration:none; font-weight:600; }
  .row a:hover { color:var(--accent); }
  .ava { width:44px; height:44px; border-radius:50%; background:var(--soft); color:var(--dim); object-fit:cover; display:grid; place-items:center; font-weight:650; flex:none; }
  .new { display:inline-block; font-size:12px; font-weight:600; color:var(--ok); background:var(--ok-soft); border-radius:999px; padding:1px 8px; margin-left:6px; }
  .x { border:0; background:none; color:var(--dim); font-size:20px; padding:4px 8px; }
  .empty { color:var(--dim); text-align:center; padding:40px 16px; }

  details.log { margin-top:30px; }
  details.log summary { cursor:pointer; color:var(--dim); font-size:14px; }
  #log { font:12.5px/1.6 ui-monospace, Menlo, Consolas, monospace; max-height:240px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--dim); margin-top:10px; }
  #log .warn, #log .error { color:var(--bad); background:none; padding:0; margin:0; font-size:inherit; }

  dialog { border:1px solid var(--line); border-radius:20px; background:var(--card); color:var(--text); padding:24px; width:min(480px, calc(100vw - 24px)); max-height:calc(100vh - 24px); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h2 { margin:0 0 4px; font-size:20px; }
  dialog .foot { display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
  dialog details { margin-top:16px; }
  dialog summary { cursor:pointer; color:var(--dim); font-size:14px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; display:none; max-width:90vw; z-index:99; }
  @media (max-width:480px) { .start { flex-direction:column; } .two { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header><b>Парсер Threads</b><button class="link" id="openPost">Написать пост</button><button class="link" id="openSettings">Настройки</button></header>

  <div class="card">
    <div id="idle">
      <div class="start"><input id="accounts" placeholder="Категория, например dating" autocomplete="off"><button class="primary big" id="start">Старт</button></div>
    </div>
    <div id="busy" class="running" hidden>
      <span class="dot"></span><div><b id="status"></b><span class="dim small" id="sub"></span></div><button id="stop">Стоп</button>
    </div>
    <div class="error" id="error" hidden></div>
    <div class="chips" id="scouts"></div>
    <div class="dim small" id="catInfo" style="margin-top:12px"></div>
  </div>

  <div class="tabs"><button data-tab="top" id="tabTop"></button><button data-tab="fans" id="tabFans"></button><button data-tab="related" id="tabRelated"></button><span style="flex:1"></span><button class="link" id="csv" style="padding:0 0 10px">CSV</button></div>
  <div id="list"></div>

  <details class="log"><summary>Журнал</summary><div id="log"></div></details>
</div>

<dialog id="settings">
  <h2>Настройки</h2>
  <label>Профиль AdsPower со входом в Threads</label><select id="adsProfile"></select>
  <label>Telegram: токен бота</label><input id="tgToken" type="password" autocomplete="off">
  <label>Telegram: chat id</label><input id="tgChat">
  <div style="margin-top:12px"><button id="tgTest">Проверить Telegram</button></div>
  <div class="two"><div><label>Минут на один запуск</label><input id="runMinutes" type="number" min="5"></div><div><label>Категорий максимум</label><input id="maxCategories" type="number" min="1"></div>
    <div><label>Авторов на категорию</label><input id="catAuthors" type="number" min="1"></div><div><label>Фанов на категорию</label><input id="catFans" type="number" min="0"></div></div>
  <label class="check" style="margin-top:18px"><input type="checkbox" id="catExpand"> Добавлять похожие категории самому</label>
  <details><summary>Каких авторов брать</summary>
    <div class="two">
      <div><label>Подписчиков от</label><input id="minFollowers" type="number" min="0"></div>
      <div><label>Лайков на пост от</label><input id="minAvgLikes" type="number" min="0"></div>
      <div><label>Постов в неделю от</label><input id="minPostsPerWeek" type="number" min="0" step="0.5"></div>
      <div><label>Комментариев на пост от</label><input id="minAvgReplies" type="number" min="0"></div>
    </div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="englishOnly"> Только англоязычные</label>
  </details>
  <details><summary>Подключение к AdsPower</summary>
    <label>Адрес Local API</label><input id="adsUrl">
    <label>API-ключ</label><input id="adsKey" type="password" autocomplete="off">
  </details>
  <div class="foot"><button class="link" data-close>Отмена</button><button class="primary" id="save">Сохранить</button></div>
</dialog>

<dialog id="post">
  <h2>Новый пост</h2>
  <textarea id="postText" maxlength="500" placeholder="Текст" style="margin-top:12px"></textarea>
  <label>Картинка</label><input id="postImage" type="file" accept="image/png,image/jpeg,image/webp">
  <div class="foot"><button class="link" data-close>Отмена</button><button class="primary" id="postSend">Опубликовать</button></div>
</dialog>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NUMS = ['minFollowers', 'minAvgLikes', 'minPostsPerWeek', 'minAvgReplies', 'runMinutes', 'maxCategories', 'catAuthors', 'catFans'];
const CHECKS = ['catExpand', 'englishOnly'];
let S = null, tab = 'top', current = null;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 5000); }
async function api(path, data) {
  const res = await fetch(path, data === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) { toast(out.error || 'Ошибка'); throw new Error(out.error); }
  return out;
}
const fmt = (n) => (n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n));
function ago(sec) {
  if (!sec) return '';
  const min = Math.max(0, Math.floor((Date.now() / 1000 - sec) / 60));
  if (min < 1) return 'только что';
  if (min < 60) return `${min} мин назад`;
  if (min < 1440) return `${Math.floor(min / 60)} ч назад`;
  return `${Math.floor(min / 1440)} дн. назад`;
}
const profileUrl = (u) => `${esc(S.settings.threadsBase)}/@${encodeURIComponent(u)}`;
const avatar = (a) => (a?.avatar ? `<img class="ava" src="/avatar/${encodeURIComponent(a.avatar)}" alt="" loading="lazy">` : `<div class="ava">${esc((a?.username || '?')[0].toUpperCase())}</div>`);

// What the parser is doing, in plain words.
function statusText(j) {
  const p = j.phase || '';
  const count = j.total ? `${j.done} из ${j.total}` : '';
  if (/^Категория/.test(p)) return [p.split(': ')[0], [p.split(': ')[1], count].filter(Boolean).join(' — ')];
  if (/^Дежурство/.test(p)) return ['Слежу за новыми постами', p.replace(/^Дежурство:\s*/, '')];
  if (/Комментинг/.test(p)) return ['Смотрю, под кем комментируют', count];
  if (/Кандидаты/.test(p)) return ['Проверяю найденных авторов', count];
  if (/Подписка/.test(p)) return ['Подписываюсь на авторов', count];
  if (/Публикация/.test(p)) return ['Публикую пост', ''];
  return ['Запускаю…', ''];
}

function render() {
  const j = S.job;
  $('idle').hidden = j.running; $('busy').hidden = !j.running;
  const [title, sub] = statusText(j);
  $('status').textContent = title; $('sub').textContent = sub;
  $('stop').hidden = j.phase === 'Публикация';
  const err = !j.running && j.log.at(-1)?.level === 'error' ? j.log.at(-1).msg : '';
  $('error').hidden = !err; $('error').textContent = err;

  const cats = S.categories;
  if (!cats.some((c) => c.name === current)) current = cats[0]?.name || null;
  const cat = cats.find((c) => c.name === current);
  $('scouts').innerHTML = cats.map((c) => `<span class="chip${c.name === current ? ' on' : ''}"><span data-cat="${esc(c.name)}">${esc(c.name)}${c.top.length ? ' · ' + c.top.length : ''}</span><button data-uncat="${esc(c.name)}" title="Убрать">×</button></span>`).join('');
  $('accounts').placeholder = cats.length ? 'Добавить категорию' : 'Категория, например dating';
  $('catInfo').textContent = !cat ? '' : !cat.scannedAt ? 'Ещё не собрана — нажмите «Старт».'
    : `Авторов ${cat.top.length} · около ${cat.postsPerDay} постов в день · фанов изучено ${cat.fansScanned} из ${cat.fansTotal}`
      + (cat.fanHours.length ? ` · фаны активнее всего в ${cat.fanHours.map((h) => String(h).padStart(2, '0') + ':00').join(', ')} UTC` : '');
  const lists = { top: cat?.top || [], fans: cat?.byFans || [], related: cat?.related || [] };
  for (const [k, id, title] of [['top', 'tabTop', 'Топ категории'], ['fans', 'tabFans', 'По фанам'], ['related', 'tabRelated', 'Похожие']]) {
    $(id).textContent = `${title}${lists[k].length ? ' · ' + lists[k].length : ''}`;
    $(id).className = tab === k ? 'on' : '';
  }
  $('csv').hidden = !cat;
  const person = (r, i) => `<div class="row"><span class="rank">${i + 1}</span>${avatar(r)}
      <div class="mid"><a href="${profileUrl(r.username)}" target="_blank" rel="noopener noreferrer">@${esc(r.username)}</a>
        <div class="dim small">${fmt(r.followers)} подписчиков · ${r.postsPerWeek} постов в неделю · ${r.avgReplies} комм. на пост${r.fans ? ` · комментируют ${r.fans} фанов` : ''}</div></div>
      <button class="x" data-remove="${esc(r.username)}" title="Убрать из базы">×</button></div>`;
  if (tab === 'related') $('list').innerHTML = lists.related.length ? lists.related.map((r) => `<div class="row"><div class="mid"><b>${esc(r.tag)}</b>
      <div class="dim small">ставят ${r.authors} авторов этой категории</div></div><button data-addcat="${esc(r.tag)}">Добавить</button></div>`).join('')
    : '<div class="empty">Похожих категорий пока нет.</div>';
  else $('list').innerHTML = lists[tab].length ? lists[tab].map(person).join('')
    : `<div class="empty">${!cat ? 'Введите категорию и нажмите «Старт».' : tab === 'fans' ? 'Появится, когда парсер изучит фанов.' : 'Нажмите «Старт» — здесь появятся авторы.'}</div>`;
}

function addLog(e) {
  const el = document.createElement('div');
  el.className = e.level;
  el.textContent = `${new Date(e.t).toLocaleTimeString('ru')}  ${e.msg}`;
  $('log').append(el);
  $('log').scrollTop = $('log').scrollHeight;
}

async function refresh(first) {
  S = await api('/api/state');
  if (first) { $('log').textContent = ''; S.job.log.forEach(addLog); }
  render();
}

// ---- settings ----
function fillSettings() {
  const s = S.settings;
  for (const k of NUMS) $(k).value = s[k];
  for (const k of CHECKS) $(k).checked = s[k];
  $('adsUrl').value = s.adsUrl; $('tgChat').value = s.tgChat;
  $('adsKey').value = ''; $('tgToken').value = '';
  $('adsKey').placeholder = s.hasKey ? 'сохранён' : 'если AdsPower просит';
  $('tgToken').placeholder = s.hasTg ? 'сохранён' : 'от @BotFather';
  $('adsProfile').innerHTML = `<option value="${esc(s.adsProfile)}">${esc(s.adsProfile || 'Загружаю список…')}</option>`;
}
async function loadProfiles() {
  try {
    const { profiles } = await api('/api/adspower/profiles', {});
    const cur = S.settings.adsProfile;
    $('adsProfile').innerHTML = '<option value="">— выберите —</option>' + profiles.map((p) =>
      `<option value="${esc(p.id)}">${esc([p.serial && '#' + p.serial, p.name].filter(Boolean).join(' · ') || p.id)}</option>`).join('');
    $('adsProfile').value = cur;
  } catch { $('adsProfile').innerHTML = `<option value="${esc(S.settings.adsProfile)}">${esc(S.settings.adsProfile || 'AdsPower не отвечает — запустите его')}</option>`; }
}
function openSettings() { fillSettings(); $('settings').showModal(); loadProfiles(); }
async function saveSettings() {
  const out = { adsProfile: $('adsProfile').value, adsUrl: $('adsUrl').value, adsKey: $('adsKey').value, tgToken: $('tgToken').value, tgChat: $('tgChat').value };
  for (const k of NUMS) out[k] = Number($(k).value);
  for (const k of CHECKS) out[k] = $(k).checked;
  S = await api('/api/settings', out);
  render();
}

// ---- actions ----
async function addAccounts() {
  const add = $('accounts').value.split(/[,\n]+/).map((x) => x.trim()).filter(Boolean);
  if (!add.length) return;
  S = await api('/api/categories', { add });
  current = add.at(-1).toLowerCase().replace(/^#/, '');
  $('accounts').value = '';
  render();
}
$('start').onclick = async () => {
  await addAccounts();
  if (!S.categories.length) return toast('Введите хотя бы одну категорию');
  if (!S.settings.adsProfile) { openSettings(); return toast('Выберите профиль AdsPower и нажмите «Старт» ещё раз'); }
  $('log').textContent = '';
  await api('/api/run', { mode: 'research' });
};
$('accounts').onkeydown = (e) => { if (e.key === 'Enter') addAccounts(); };
$('stop').onclick = () => api('/api/stop', {});
$('openSettings').onclick = openSettings;
$('openPost').onclick = () => $('post').showModal();
$('save').onclick = async () => { await saveSettings(); $('settings').close(); toast('Сохранено'); };
$('tgTest').onclick = async () => { await saveSettings(); await api('/api/tg-test', {}); toast('Отправил — проверьте Telegram'); };
$('postSend').onclick = async () => {
  const text = $('postText').value.trim();
  if (!text) return toast('Напишите текст');
  if (!S.settings.adsProfile) { $('post').close(); openSettings(); return toast('Сначала выберите профиль AdsPower'); }
  const file = $('postImage').files[0];
  let image;
  if (file) {
    if (file.size > 8e6) return toast('Картинка больше 8 МБ');
    image = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); });
  }
  await api('/api/post', { text, image });
  $('postText').value = ''; $('postImage').value = '';
  $('post').close();
  toast('Публикую…');
};
document.addEventListener('click', async (e) => {
  const pick = e.target.closest('[data-cat]');
  if (pick) { current = pick.dataset.cat; return render(); }
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.close !== undefined) return t.closest('dialog').close();
  if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
  if (t.dataset.uncat) { if (confirm(`Убрать категорию «${t.dataset.uncat}»?`)) { S = await api('/api/categories', { remove: [t.dataset.uncat] }); render(); } return; }
  if (t.dataset.addcat) { S = await api('/api/categories', { add: [t.dataset.addcat] }); return render(); }
  if (t.id === 'csv') { location.href = `/api/category.csv?name=${encodeURIComponent(current)}`; return; }
  if (t.dataset.remove) { S = await api(`/api/account/${encodeURIComponent(t.dataset.remove)}`, { status: 'rejected' }); return render(); }
});

const es = new EventSource('/api/events');
es.addEventListener('log', (e) => { const d = JSON.parse(e.data); addLog(d); if (S) S.job.log.push(d); });
es.addEventListener('progress', (e) => { if (S) { Object.assign(S.job, JSON.parse(e.data)); render(); } });
es.addEventListener('status', () => refresh());
es.addEventListener('change', () => refresh());
refresh(true);
</script>
</body>
</html>
