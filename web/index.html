<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видеостудия</title>
<style>
:root {
  --bg: #0e1014; --panel: #161920; --panel2: #1d212a; --line: #2a2f3a; --text: #e7e9ee; --dim: #8d94a3;
  --accent: #5b8cff; --v1: #3b6fd9; --v2: #8a5cd6; --a: #2f9e77; --tx: #c98a1b; --danger: #e5484d;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: var(--text);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.mini { padding: 1px 6px; font-size: 11px; }
select, input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0; font-weight: 600; }

#app { display: grid; height: 100%; grid-template-rows: 44px minmax(0, 1fr) 250px; grid-template-columns: 250px minmax(0, 1fr) 290px; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; margin-right: 6px; }
header .spacer { flex: 1; }
#exportInfo { color: var(--dim); }
#exportInfo a { color: var(--accent); }
.pane { background: var(--panel); overflow: auto; min-height: 0; }
.pane .head { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-bottom: 1px solid var(--line); z-index: 2; }
#pool { border-right: 1px solid var(--line); }
#side { border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
#side > section { overflow: auto; min-height: 0; }
#inspector { flex: 0 0 auto; max-height: 55%; border-bottom: 1px solid var(--line); }
#log { flex: 1; }

.media { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.media .th { width: 76px; height: 48px; border-radius: 4px; background: #000 center/cover no-repeat; display: grid; place-items: center; color: var(--dim); font-size: 18px; }
.media .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media .meta { color: var(--dim); font-size: 11px; margin: 1px 0 4px; }
.empty { color: var(--dim); padding: 16px 12px; line-height: 1.5; }
#pool.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }

#center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#stageWrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
#stage { position: relative; height: 100%; max-width: 100%; background: #000; overflow: hidden; border-radius: 4px; container-type: size; }
#stage video, #stage img { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
#texts { position: absolute; inset: 0; pointer-events: none; }
#texts div { position: absolute; left: 6%; right: 6%; transform: translateY(-50%); text-align: center; font-weight: 800; line-height: 1.3; white-space: pre-wrap; overflow-wrap: break-word;
  text-shadow: -.06em -.06em 0 #000, .06em -.06em 0 #000, -.06em .06em 0 #000, .06em .06em 0 #000, 0 .06em 0 #000, 0 -.06em 0 #000, .06em 0 0 #000, -.06em 0 0 #000; }
#texts span { padding: .15em .35em; border-radius: .15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
#transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#time { font-variant-numeric: tabular-nums; min-width: 110px; }

#timeline { grid-column: 1 / -1; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: 46px minmax(0, 1fr); min-height: 0; }
#labels div, .row { height: 38px; border-bottom: 1px solid var(--line); }
#labels { padding-top: 22px; border-right: 1px solid var(--line); }
#labels div { display: grid; place-items: center; color: var(--dim); font-size: 11px; font-weight: 600; }
#scroll { overflow: auto; position: relative; }
#lanes { position: relative; min-width: 100%; }
#ruler { height: 22px; position: sticky; top: 0; background: var(--panel2); border-bottom: 1px solid var(--line); cursor: pointer; z-index: 3; }
#ruler span { position: absolute; top: 4px; font-size: 10px; color: var(--dim); border-left: 1px solid var(--line); padding-left: 3px; height: 18px; pointer-events: none; }
.row { position: relative; }
.blk { position: absolute; top: 4px; height: 29px; border-radius: 5px; padding: 0 8px; line-height: 29px; font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: grab; touch-action: none; user-select: none; border: 1px solid rgba(255,255,255,.18); color: #fff; }
.blk.V1 { background: var(--v1); } .blk.V2 { background: var(--v2); } .blk.A1, .blk.A2 { background: var(--a); } .blk.T { background: var(--tx); }
.blk.sel { outline: 2px solid #fff; outline-offset: -1px; z-index: 2; }
.blk i { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.blk i.l { left: 0; } .blk i.r { right: 0; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff5a5a; pointer-events: none; z-index: 4; }

.form { display: grid; grid-template-columns: 96px 1fr; gap: 6px 8px; padding: 10px; align-items: center; }
.form label { color: var(--dim); }
.form textarea { grid-column: 1 / -1; resize: vertical; min-height: 54px; }
.form .full { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.act { padding: 6px 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: baseline; }
.act b { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--v2); font-weight: 600; }
.act b.user { background: var(--panel2); border: 1px solid var(--line); }
.act small { color: var(--dim); font-variant-numeric: tabular-nums; }
.act .d { grid-column: 2 / -1; color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
#toast { position: fixed; left: 50%; bottom: 266px; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 8px 14px; border-radius: 6px; display: none; z-index: 20; max-width: 80vw; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: 320px; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { display: grid; gap: 10px; }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) 210px; }
  #pool, #side { display: none; }
  header .brand { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Видеостудия</span>
    <select id="projects" aria-label="Проект"></select>
    <button id="newBtn">+ Проект</button>
    <span class="spacer"></span>
    <span id="exportInfo"></span>
    <button id="draftBtn" title="Быстрый экспорт в 720p">Черновик</button>
    <button id="exportBtn" class="primary">Экспорт MP4</button>
  </header>

  <aside id="pool" class="pane">
    <div class="head"><h2>Медиатека</h2><button id="uploadBtn" class="mini">Загрузить</button></div>
    <input id="file" type="file" multiple hidden accept="video/*,audio/*,image/*">
    <div id="mediaList"></div>
  </aside>

  <main id="center">
    <div id="stageWrap">
      <div id="stage">
        <video id="vV1" playsinline preload="auto"></video><img id="iV1" alt="">
        <video id="vV2" playsinline preload="auto"></video><img id="iV2" alt="">
        <div id="texts"></div>
      </div>
    </div>
    <div id="transport">
      <button id="playBtn" title="Пробел">▶</button>
      <span id="time">0:00.0 / 0:00.0</span>
      <button id="splitBtn" title="Разрезать клип под курсором (S)">Разрезать</button>
      <button id="delBtn" title="Delete">Удалить</button>
      <button id="silBtn" title="Найти и вырезать паузы в речи">Убрать паузы</button>
      <button id="textBtn">+ Текст</button>
      <span class="spacer" style="flex:1"></span>
      <label for="zoom" style="color:var(--dim)">Масштаб</label>
      <input id="zoom" type="range" min="10" max="240" value="60" style="width:110px;padding:0">
    </div>
  </main>

  <aside id="side" class="pane">
    <section id="inspector"><div class="head"><h2>Свойства</h2></div><div id="insBody"></div></section>
    <section id="log"><div class="head"><h2>Журнал действий</h2></div><div id="logBody"></div></section>
  </aside>

  <section id="timeline">
    <div id="labels"><div>Текст</div><div>V2</div><div>V1</div><div>A1</div><div>A2</div></div>
    <div id="scroll"><div id="lanes">
      <div id="ruler"></div>
      <div class="row" data-track="T"></div><div class="row" data-track="V2"></div><div class="row" data-track="V1"></div>
      <div class="row" data-track="A1"></div><div class="row" data-track="A2"></div>
      <div id="playhead"></div>
    </div></div>
  </section>
</div>
<div id="toast" role="alert"></div>
<dialog id="newDlg"><form method="dialog">
  <h2>Новый проект</h2>
  <input id="newName" placeholder="Название" required>
  <select id="newAspect" aria-label="Формат кадра">
    <option value="9:16">9:16 — Reels, Shorts, TikTok</option><option value="16:9">16:9 — YouTube</option>
    <option value="1:1">1:1 — квадрат</option><option value="4:5">4:5 — лента Instagram</option>
  </select>
  <div class="btns"><button value="cancel" formnovalidate>Отмена</button><button value="ok" class="primary">Создать</button></div>
</form></dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
const VT = ['V1', 'V2'], AT = ['A1', 'A2'];
const ACTIONS = { create_project: 'Создан проект', import_media: 'Импорт файла', create_background: 'Создан фон', add_clip: 'Клип на таймлайн',
  update_clip: 'Изменён клип', split_clip: 'Разрез', remove_clip: 'Удалён клип', remove_silences: 'Вырезаны паузы', add_texts: 'Добавлен текст',
  update_text: 'Изменён текст', remove_texts: 'Удалён текст', export_video: 'Экспорт' };

let exporting = false, P = null, sel = null, T = 0, playing = false, pps = 60, drag = null, last = performance.now();
const audioEls = { A1: new Audio(), A2: new Audio() };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 4500); }
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
  return data;
}
const op = (name, args = {}) => api(`/api/op/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(P ? { projectId: P.id, ...args } : args) });
const run = (name, args) => op(name, args).then((r) => refresh().then(() => r)).catch((e) => { toast(e.message); refresh(); });

const allClips = () => (P ? [...VT, ...AT].flatMap((t) => P.tracks[t]) : []);
const mediaOf = (c) => P.media.find((m) => m.id === c.mediaId);
const selected = () => !sel || !P ? null : sel.kind === 'T' ? P.texts.find((t) => t.id === sel.id) : allClips().find((c) => c.id === sel.id);

async function loadProjects(pickId) {
  const { list } = await op('list_projects');
  const cur = pickId || P?.id || localStorage.getItem('studio.project');
  $('projects').innerHTML = list.map((p) => `<option value="${p.id}">${esc(p.name)} · ${p.width}×${p.height}</option>`).join('') || '<option value="">Нет проектов</option>';
  const id = list.some((p) => p.id === cur) ? cur : list[0]?.id;
  if (id) { $('projects').value = id; if (P?.id !== id) { P = { id }; sel = null; T = 0; } await refresh(); }
  else { P = null; render(); }
}

async function refresh() {
  if (!P) return loadProjects();
  try {
    P = await api('/api/op/get_timeline', { method: 'POST', body: JSON.stringify({ projectId: P.id }) });
    try { localStorage.setItem('studio.project', P.id); } catch {}
    $('logBody').innerHTML = (await api(`/api/activity/${P.id}`)).reverse().map((a) =>
      `<div class="act"><b class="${a.actor === 'user' ? 'user' : ''}">${a.actor === 'user' ? 'вы' : 'агент'}</b><span>${esc(ACTIONS[a.action] || a.action)}</span><small>${new Date(a.t).toLocaleTimeString('ru')}</small><div class="d">${esc(a.detail)}</div></div>`).join('');
  } catch (e) { toast(e.message); P = null; }
  render();
}

function render() {
  const has = !!P?.tracks;
  for (const id of ['exportBtn', 'draftBtn', 'uploadBtn', 'playBtn', 'splitBtn', 'delBtn', 'silBtn', 'textBtn']) $(id).disabled = !has || (exporting && (id === 'exportBtn' || id === 'draftBtn'));
  if (!has) {
    $('mediaList').innerHTML = '<div class="empty">Создайте проект кнопкой «+ Проект» или попросите ИИ-агента: «создай ролик из моих файлов…»</div>';
    document.querySelectorAll('.row').forEach((r) => (r.innerHTML = '')); $('insBody').innerHTML = ''; $('logBody').innerHTML = '';
    return;
  }
  $('stage').style.aspectRatio = `${P.width} / ${P.height}`;
  $('mediaList').innerHTML = P.media.map((m) => {
    const th = m.thumb ? `style="background-image:url('/thumb/${P.id}/${m.thumb}')"` : '';
    const btns = m.kind === 'audio' ? ['A1', 'A2'] : ['V1', 'V2'];
    return `<div class="media"><div class="th" ${th}>${m.thumb ? '' : '♪'}</div><div style="min-width:0"><div class="nm" title="${esc(m.name)}">${esc(m.name)}</div>
      <div class="meta">${m.kind === 'image' ? 'картинка' : fmt(m.duration)}${m.width ? ` · ${m.width}×${m.height}` : ''}</div>
      ${btns.map((t) => `<button class="mini" data-add="${m.id}" data-track="${t}">+ ${t}</button>`).join(' ')}</div></div>`;
  }).join('') || '<div class="empty">Перетащите сюда видео, фото или музыку — либо нажмите «Загрузить».</div>';
  renderTimeline(); renderInspector();
}

function renderTimeline() {
  const width = Math.max((P.duration + 8) * pps, $('scroll').clientWidth);
  $('lanes').style.width = width + 'px';
  const step = [0.5, 1, 2, 5, 10, 30, 60].find((s) => s * pps >= 56) || 120;
  let marks = '';
  for (let s = 0; s * pps < width; s += step) marks += `<span style="left:${s * pps}px">${fmt(s).replace(/\.0$/, '')}</span>`;
  $('ruler').innerHTML = marks;
  const blk = (kind, o, s, e, label) => `<div class="blk ${kind}${sel?.id === o.id ? ' sel' : ''}" data-kind="${kind}" data-id="${o.id}" style="left:${s * pps}px;width:${Math.max(6, (e - s) * pps)}px" title="${esc(label)}"><i class="l"></i>${esc(label)}<i class="r"></i></div>`;
  document.querySelectorAll('.row').forEach((row) => {
    const t = row.dataset.track;
    row.innerHTML = t === 'T' ? P.texts.map((x) => blk('T', x, x.start, x.end, x.text)).join('') : P.tracks[t].map((c) => blk(t, c, c.start, c.end, c.file)).join('');
  });
}

function renderInspector() {
  const o = selected();
  if (!o) { $('insBody').innerHTML = '<div class="empty">Выберите клип или текст на таймлайне.</div>'; return; }
  const numF = (k, label, step, min, max, v) => `<label for="f_${k}">${label}</label><input id="f_${k}" data-k="${k}" type="number" step="${step}" min="${min}" max="${max}" value="${v ?? ''}">`;
  const selF = (k, label, opts, v) => `<label for="f_${k}">${label}</label><select id="f_${k}" data-k="${k}">${opts.map(([val, name]) => `<option value="${val}"${val === v ? ' selected' : ''}>${name}</option>`).join('')}</select>`;
  if (sel.kind === 'T') {
    $('insBody').innerHTML = `<div class="form"><textarea data-k="text" aria-label="Текст">${esc(o.text)}</textarea>
      ${numF('start', 'Начало, с', 0.1, 0, 36000, o.start)}${numF('end', 'Конец, с', 0.1, 0, 36000, o.end)}
      ${selF('position', 'Позиция', [['top', 'Сверху'], ['center', 'По центру'], ['bottom', 'Снизу']], o.position)}
      ${numF('size', 'Размер', 0.005, 0.015, 0.2, o.size)}
      <label for="f_color">Цвет</label><input id="f_color" data-k="color" value="${esc(o.color)}">
      ${selF('bg', 'Подложка', [['', 'Нет'], ['black@0.55', 'Тёмная'], ['white@0.85', 'Светлая'], ['#FFD400', 'Жёлтая']], o.bg || '')}</div>`;
  } else {
    const isV = VT.includes(o.track), m = mediaOf(o);
    $('insBody').innerHTML = `<div class="form"><div class="full" style="color:var(--dim)">${esc(o.file)} · ${fmt(o.end - o.start)}</div>
      ${numF('start', 'Начало, с', 0.1, 0, 36000, o.start)}
      ${m.kind === 'image' ? numF('out', 'Длительность', 0.1, 0.1, 600, o.out) : numF('in', 'Вход, с', 0.1, 0, m.duration, o.in) + numF('out', 'Выход, с', 0.1, 0, m.duration, o.out)}
      ${isV ? selF('fit', 'Кадрирование', [['cover', 'Заполнить'], ['contain', 'Вписать'], ['blur', 'Размытый фон']], o.fit) + numF('zoom', 'Зум', 0.05, 1, 4, o.zoom) + numF('zoomTo', 'Наезд до', 0.05, 1, 4, o.zoomTo) : ''}
      ${m.kind !== 'image' ? numF('speed', 'Скорость', 0.1, 0.5, 2, o.speed) : ''}${m.hasAudio ? numF('volume', 'Громкость', 0.1, 0, 4, o.volume) : ''}
      ${numF('fadeIn', 'Появление, с', 0.1, 0, 10, o.fadeIn)}${numF('fadeOut', 'Затухание, с', 0.1, 0, 10, o.fadeOut)}</div>`;
  }
}

$('insBody').addEventListener('change', (e) => {
  const k = e.target.dataset.k; if (!k || !sel) return;
  let v = e.target.type === 'number' ? (e.target.value === '' ? null : Number(e.target.value)) : e.target.value;
  if (k === 'bg') v = v || null;
  if (v === null && k !== 'zoomTo' && k !== 'bg') return renderInspector();
  sel.kind === 'T' ? run('update_text', { textId: sel.id, [k]: v }) : run('update_clip', { clipId: sel.id, [k]: v });
});

/* ---------- preview ---------- */
function activeClip(track) {
  return P.tracks[track].filter((c) => c.start <= T && c.end > T).pop();
}
function syncMediaEl(el, c, m) {
  const src = `/media/${P.id}/${m.id}`;
  if (el.dataset.src !== src) { el.dataset.src = src; el.src = src; }
  const sp = c.speed || 1, want = c.in + (T - c.start) * sp;
  el.playbackRate = sp; el.muted = !(c.volume > 0); el.volume = Math.min(1, c.volume ?? 1);
  if (playing) {
    if (el.paused) el.play().catch(() => {});
    if (Math.abs(el.currentTime - want) > 0.3) el.currentTime = want;
  } else {
    if (!el.paused) el.pause();
    if (Math.abs(el.currentTime - want) > 0.03) el.currentTime = want;
  }
}
function sync() {
  if (!P?.tracks) return;
  for (const tr of VT) {
    const v = $('v' + tr), img = $('i' + tr), c = activeClip(tr), m = c && mediaOf(c);
    const el = !m ? null : m.kind === 'image' ? img : v;
    v.style.display = el === v ? 'block' : 'none'; img.style.display = el === img ? 'block' : 'none';
    if (el !== v && !v.paused) v.pause();
    if (!el) continue;
    if (el === img) { const src = `/media/${P.id}/${m.id}`; if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; } }
    else syncMediaEl(v, c, m);
    const d = c.end - c.start, k = (T - c.start) / d, z = c.zoom + ((c.zoomTo ?? c.zoom) - c.zoom) * k;
    el.style.objectFit = c.fit === 'cover' ? 'cover' : 'contain';
    el.style.transform = `scale(${z})`;
    el.style.opacity = Math.min(1, c.fadeIn ? (T - c.start) / c.fadeIn : 1, c.fadeOut ? (c.end - T) / c.fadeOut : 1);
  }
  for (const tr of AT) {
    const a = audioEls[tr], c = activeClip(tr);
    if (c) syncMediaEl(a, c, mediaOf(c)); else if (!a.paused) a.pause();
  }
  $('texts').innerHTML = P.texts.filter((x) => x.start <= T && x.end > T).map((x) => {
    const y = x.y ?? { top: 0.13, center: 0.5, bottom: P.width > P.height ? 0.84 : 0.74 }[x.position || 'bottom'];
    return `<div style="top:${y * 100}%;font-size:${x.size * 100}cqh;color:${esc(x.color)}"><span style="${x.bg ? `background:${esc(cssColor(x.bg))}` : ''}">${esc(x.text)}</span></div>`;
  }).join('');
  $('playhead').style.left = T * pps + 'px';
  $('time').textContent = `${fmt(T)} / ${fmt(P.duration)}`;
}
function cssColor(c) {
  const [base, alpha] = c.split('@');
  return alpha ? `color-mix(in srgb, ${base} ${Number(alpha) * 100}%, transparent)` : base;
}
function setPlaying(v) { playing = v && P?.duration > 0; if (playing && T >= P.duration - 0.05) T = 0; $('playBtn').textContent = playing ? '❚❚' : '▶'; }
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) {
    T += dt;
    if (T >= P.duration) { T = P.duration; setPlaying(false); }
    const sc = $('scroll'), x = T * pps;
    if (x > sc.scrollLeft + sc.clientWidth - 40 || x < sc.scrollLeft) sc.scrollLeft = x - 80;
  }
  sync();
  requestAnimationFrame(frame);
}

/* ---------- timeline interaction ---------- */
const xToTime = (clientX) => Math.max(0, (clientX - $('lanes').getBoundingClientRect().left) / pps);
$('ruler').addEventListener('pointerdown', (e) => {
  if (!P?.tracks) return;
  const move = (ev) => { T = Math.min(xToTime(ev.clientX), P.duration); };
  move(e); setPlaying(false);
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
$('lanes').addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.blk');
  if (!el) { if (e.target.classList.contains('row')) { sel = null; renderTimeline(); renderInspector(); } return; }
  const kind = el.dataset.kind === 'T' ? 'T' : 'C';
  sel = { kind, id: el.dataset.id };
  const o = selected();
  drag = { el, o, kind, x: e.clientX, y: e.clientY, mode: e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm', moved: false, next: null };
  el.setPointerCapture(e.pointerId);
  document.querySelectorAll('.blk.sel').forEach((b) => b.classList.remove('sel')); el.classList.add('sel');
  renderInspector();
});
$('lanes').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 3 && Math.abs(e.clientY - drag.y) < 12) return;
  drag.moved = true;
  const { o, mode, kind } = drag, d = dx / pps, end = o.end, len = end - o.start;
  let start = o.start, newEnd = end;
  if (mode === 'm') {
    start = Math.max(0, o.start + d);
    // Snap to the playhead and to neighbouring clip edges.
    const edges = [0, T, ...allClips().filter((c) => c.id !== o.id).flatMap((c) => [c.start, c.end])];
    for (const x of edges) { if (Math.abs(start - x) * pps < 7) start = x; else if (Math.abs(start + len - x) * pps < 7) start = Math.max(0, x - len); }
    newEnd = start + len;
    const row = document.elementFromPoint(e.clientX, e.clientY)?.closest('.row')?.dataset.track;
    drag.track = kind === 'C' && row && VT.includes(row) === VT.includes(o.track) && AT.includes(row) === AT.includes(o.track) ? row : null;
  } else if (mode === 'l') {
    start = Math.min(end - 0.1, Math.max(0, o.start + d));
    if (kind === 'C' && mediaOf(o).kind !== 'image') start = Math.max(start, o.start - o.in / (o.speed || 1));
  } else {
    newEnd = Math.max(o.start + 0.1, end + d);
    if (kind === 'C' && mediaOf(o).kind !== 'image') newEnd = Math.min(newEnd, o.start + (mediaOf(o).duration - o.in) / (o.speed || 1));
  }
  drag.next = { start, end: newEnd };
  drag.el.style.left = start * pps + 'px'; drag.el.style.width = Math.max(6, (newEnd - start) * pps) + 'px';
});
$('lanes').addEventListener('pointerup', () => {
  const g = drag; drag = null;
  if (!g?.moved || !g.next) return;
  const { o, kind, mode, next } = g, r = (x) => Number(x.toFixed(3));
  if (kind === 'T') return run('update_text', { textId: o.id, start: r(next.start), end: r(next.end) });
  const sp = o.speed || 1, isImg = mediaOf(o).kind === 'image', a = { clipId: o.id };
  if (mode === 'm') { a.start = r(next.start); if (g.track && g.track !== o.track) a.track = g.track; }
  else if (mode === 'l') { a.start = r(next.start); if (isImg) a.out = r(next.end - next.start); else a.in = r(o.in + (next.start - o.start) * sp); }
  else a.out = r(isImg ? next.end - next.start : o.in + (next.end - o.start) * sp);
  run('update_clip', a);
});

/* ---------- actions ---------- */
function splitAtPlayhead() {
  const s = selected();
  const c = sel?.kind === 'C' && s.start < T && s.end > T ? s : activeClip('V2') || activeClip('V1') || activeClip('A1') || activeClip('A2');
  if (!c) return toast('Под курсором нет клипа');
  run('split_clip', { clipId: c.id, at: Number(T.toFixed(3)) });
}
function removeSelected(ripple) {
  if (!sel) return;
  const s = sel; sel = null;
  s.kind === 'T' ? run('remove_texts', { textIds: [s.id] }) : run('remove_clip', { clipId: s.id, ripple });
}
$('playBtn').onclick = () => setPlaying(!playing);
$('splitBtn').onclick = splitAtPlayhead;
$('delBtn').onclick = (e) => removeSelected(!e.shiftKey);
$('textBtn').onclick = async () => {
  const r = await run('add_texts', { texts: [{ text: 'Новый текст', start: Number(T.toFixed(2)), end: Number((T + 2).toFixed(2)) }] });
  if (r) { sel = { kind: 'T', id: r.added[0].id }; render(); }
};
$('silBtn').onclick = async () => {
  $('silBtn').disabled = true; $('silBtn').textContent = 'Ищу паузы…';
  const r = await run('remove_silences', sel?.kind === 'C' ? { clipId: sel.id } : {});
  $('silBtn').textContent = 'Убрать паузы'; $('silBtn').disabled = false;
  if (r) { sel = null; $('exportInfo').textContent = r.removedSeconds ? `Вырезано пауз: ${r.removedSeconds} с` : 'Пауз не найдено'; }
};
$('zoom').oninput = (e) => { pps = Number(e.target.value); if (P?.tracks) renderTimeline(); };
$('projects').onchange = (e) => { P = { id: e.target.value }; sel = null; T = 0; setPlaying(false); refresh(); };
$('newBtn').onclick = () => { $('newName').value = ''; $('newDlg').showModal(); };
$('newDlg').addEventListener('close', async () => {
  if ($('newDlg').returnValue !== 'ok' || !$('newName').value.trim()) return;
  try { const p = await op('create_project', { name: $('newName').value.trim(), aspect: $('newAspect').value, projectId: undefined }); await loadProjects(p.id); }
  catch (e) { toast(e.message); }
});
$('mediaList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-add]');
  if (b) run('add_clip', { mediaId: b.dataset.add, track: b.dataset.track });
});
async function upload(files) {
  for (const f of files) {
    $('exportInfo').textContent = `Загрузка: ${f.name}…`;
    try { await api(`/api/upload/${P.id}?name=${encodeURIComponent(f.name)}`, { method: 'POST', body: f }); }
    catch (e) { toast(`${f.name}: ${e.message}`); }
  }
  $('exportInfo').textContent = ''; refresh();
}
$('uploadBtn').onclick = () => $('file').click();
$('file').onchange = (e) => { upload([...e.target.files]); e.target.value = ''; };
$('pool').addEventListener('dragover', (e) => { e.preventDefault(); $('pool').classList.add('drop'); });
$('pool').addEventListener('dragleave', () => $('pool').classList.remove('drop'));
$('pool').addEventListener('drop', (e) => { e.preventDefault(); $('pool').classList.remove('drop'); if (P?.tracks) upload([...e.dataTransfer.files]); });

async function exportVideo(args) {
  setPlaying(false); exporting = true;
  $('exportBtn').disabled = $('draftBtn').disabled = true; $('exportInfo').textContent = 'Рендер: 0%';
  try {
    const r = await op('export_video', args);
    $('exportInfo').innerHTML = `Готово: <a href="/export/${P.id}/${encodeURIComponent(r.fileName)}" target="_blank" rel="noopener">смотреть</a> · <a href="/export/${P.id}/${encodeURIComponent(r.fileName)}?dl">скачать (${r.sizeMb} МБ)</a>`;
  } catch (e) { $('exportInfo').textContent = ''; toast(e.message); }
  exporting = false; refresh();
}
$('exportBtn').onclick = () => exportVideo({});
$('draftBtn').onclick = () => exportVideo({ height: 720, crf: 26 });

addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, dialog') || !P?.tracks) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'KeyS') splitAtPlayhead();
  else if (e.code === 'Delete' || e.code === 'Backspace') removeSelected(!e.shiftKey);
  else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { setPlaying(false); T = Math.min(P.duration, Math.max(0, T + (e.code === 'ArrowLeft' ? -1 : 1) / P.fps)); }
});
addEventListener('resize', () => P?.tracks && renderTimeline());

const es = new EventSource('/api/events');
es.addEventListener('change', () => { if (!drag) loadProjects().catch(() => {}); });
es.addEventListener('progress', (e) => { const d = JSON.parse(e.data); if (d.projectId === P?.id) $('exportInfo').textContent = `Рендер: ${Math.round(d.fraction * 100)}%`; });

loadProjects().catch((e) => toast(e.message));
requestAnimationFrame(frame);
</script>
</body>
</html>
